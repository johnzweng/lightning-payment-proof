# nginx server block for Lightning Payment Proof (static files only).
#
# Works as-is with the official Docker image (see README.md), or copy it into
# /etc/nginx/conf.d/ on your server and adjust server_name and root.
# TLS is expected to be terminated here or by a reverse proxy in front.

# Proof links carry the invoice and the preimage in the query string:
# log the path only ($uri), never the query string or the referer.
log_format ln_proof_no_query '$remote_addr - [$time_local] "$request_method $uri $server_protocol" '
                             '$status $body_bytes_sent "$http_user_agent"';

server {
    listen      80;
    listen      [::]:80;
    server_name _;                              # e.g. ln-payment-proof.example.com

    root        /usr/share/nginx/html;          # the contents of public/
    index       index.html;
    charset     utf-8;
    charset_types text/css application/javascript text/javascript text/plain text/x-python image/svg+xml;
    server_tokens off;

    access_log  /var/log/nginx/access.log ln_proof_no_query;

    # All verification runs in the browser. The only outgoing request: node lookups
    # (public keys only) on mempool.space.
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self' https://mempool.space; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;

    # Browsers revalidate every file (cheap: ETag / 304), so updates are visible immediately.
    expires -1;

    location ~ /\. {
        deny all;
    }

    location = /assets/verify_invoice.py {
        default_type text/plain;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
